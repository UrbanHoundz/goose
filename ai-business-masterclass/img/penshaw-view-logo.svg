<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" role="img" aria-label="Penshaw View Training">
  <defs>
    <linearGradient id="pvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B6B8A"/>
      <stop offset="100%" style="stop-color:#00D4E8"/>
    </linearGradient>
    <linearGradient id="pvGradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B6B8A"/>
      <stop offset="100%" style="stop-color:#00D4E8"/>
    </linearGradient>
  </defs>

  <!-- 3×3 dot grid -->
  <circle cx="12" cy="12" r="7" fill="#1B6B8A"/>
  <circle cx="30" cy="12" r="7" fill="#1B6B8A" opacity="0.85"/>
  <circle cx="48" cy="12" r="7" fill="#00D4E8" opacity="0.7"/>
  <circle cx="12" cy="30" r="7" fill="#1B6B8A" opacity="0.85"/>
  <circle cx="30" cy="30" r="7" fill="#1B6B8A"/>
  <circle cx="48" cy="30" r="7" fill="#00D4E8" opacity="0.8"/>
  <circle cx="12" cy="48" r="7" fill="#00D4E8" opacity="0.6"/>
  <circle cx="30" cy="48" r="7" fill="#00D4E8" opacity="0.75"/>
  <circle cx="48" cy="48" r="7" fill="#00D4E8"/>

  <!-- PV letters with gradient -->
  <text x="72" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="62" font-weight="900" fill="url(#pvGrad)" letter-spacing="-2">PV</text>

  <!-- Penshaw View text -->
  <text x="72" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="15" font-weight="700" fill="#0A1E2D" letter-spacing="0.5">Penshaw</text>
  <text x="155" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="15" font-weight="700" fill="#00D4E8" letter-spacing="0.5"> View</text>

  <!-- Training subtitle -->
  <text x="72" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="9.5" font-weight="500" fill="#1B6B8A" letter-spacing="2.5">TRAINING</text>
</svg>
